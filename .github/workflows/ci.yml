name: CMake Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  cmake-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobilewebview/tests/js/package-lock.json

      - name: Run JS unit tests
        working-directory: mobilewebview/tests/js
        run: |
          npm ci
          npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Java Android unit tests
        run: bash scripts/run_java_android_tests.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.0"
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel

      - name: Configure
        run: cmake -S mobilewebview -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  cmake-tests-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.0"
          arch: clang_64
          modules: qtwebchannel

      - name: Configure
        run: cmake -S mobilewebview -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
